[package]
name = "slime-mould"
version = "0.1.0"
edition = "2021"
# Kept from Pixel_Physics: the real MSRV, and clippy reads it (it is why
# `chunks_exact_to_as_chunks` does not fire -- `as_chunks` is newer).
rust-version = "1.87"
license-file = "LICENSE"
publish = false
default-run = "mould"

# Moved out of Pixel_Physics on 2026-11-10 (owner's ask). The game never used
# the falling-sand engine: its whole model is `src/mould/`, and the only
# engine pieces it drew with were the 5x7 font (`src/hud.rs`) and, for the
# organ probe's offline render, the WAV writer (`src/wav.rs`). Both were
# copied rather than shared, so the two repos have no build link.
[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
pixels = "0.17"
winit = "0.30"

# Sound for `--bin organ`, the same arrangement Pixel_Physics uses: cpal needs
# the ALSA headers on Linux, which neither cloud containers nor CI's
# ubuntu-latest have, so it is a plain dependency on macOS and Windows and
# opt-in on Linux (`--features audio-alsa`, needs libasound2-dev).
# `default-features = false`: cpal's `realtime` pulls an MPL-2.0 crate.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = { version = "0.18.2", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { version = "0.18.2", default-features = false, optional = true }

[features]
audio-alsa = ["dep:cpal"]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# **Measured on the mould, 2026-11-10** (Reports/pixel-physics-review-
# 2026-11-10.md, *Step 2*). This profile came from Pixel_Physics, where it was
# measured on the sand engine: all of its gain was `codegen-units = 1`, none
# was LTO. The same holds here. `mouldprobe seeds=1 players=plan` cost line,
# free dish, scale 4, four builds alternating, three rounds, one 4-core box:
#
#                       mean frame ms (3 runs)   draw part    rebuild after touching mod.rs
#   lto thin + cgu 1      5.00  4.88  4.95       3.78-3.87       13.7 s
#   cgu 1 alone           4.86  4.99  4.95       3.76-3.86       13.4 s
#   lto thin alone        5.44  5.47  5.38       4.28-4.35        9.5 s
#   neither (cargo's)     5.39  5.59  5.39       4.28-4.44        7.6 s
#
# So `codegen-units = 1` is worth about 0.45 ms a frame (about 9%, all of it in
# drawing; the simulation is 1.10-1.15 ms in every arm) for about +6 s a
# rebuild, and thin LTO adds nothing on top. LTO is dropped. Every arm printed
# the same dish hashes (`Dish::state_hash`), so the game is bit for bit the same.
[profile.release]
codegen-units = 1
