<!-- The soldier sprite (owner's pick, 2026-11-11 16:48Z: "Solider A looks better"),
     top-down, facing +x, one unit = the soldier's radius. Layers are drawn
     separately by examples/../scripts (see README in this folder): body, helmet
     (white, tinted with the team's colour in the view), flash, dead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 4 4" width="512" height="512">
 <defs>
  <radialGradient id="helm" cx="-0.25" cy="-0.3" r="0.6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8b8b8"/></radialGradient>
  <radialGradient id="body" cx="-0.3" cy="-0.4" r="1.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a3ad74"/><stop offset="1" stop-color="#596040"/></radialGradient>
  <radialGradient id="deadbody" cx="-0.3" cy="-0.4" r="1.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6e6c64"/><stop offset="1" stop-color="#3a3935"/></radialGradient>
 </defs>
 <g id="body">
  <rect x="-0.72" y="-0.42" width="0.42" height="0.84" rx="0.12" fill="#3a3d28" stroke="#22241a" stroke-width="0.04"/>
  <ellipse cx="-0.08" cy="0" rx="0.38" ry="0.8" fill="url(#body)" stroke="#2a2d1d" stroke-width="0.05"/>
  <path d="M -0.02 0.58 L 0.5 0.36" stroke="#5c6442" stroke-width="0.28" stroke-linecap="round"/>
  <path d="M 0 -0.56 L 0.78 0.26" stroke="#5c6442" stroke-width="0.26" stroke-linecap="round"/>
  <rect x="0.0" y="0.22" width="1.45" height="0.17" rx="0.05" fill="#2a2a2e" stroke="#111" stroke-width="0.03"/>
  <rect x="0.45" y="0.36" width="0.14" height="0.22" fill="#1d1d20"/>
  <circle cx="0.5" cy="0.36" r="0.1" fill="#c9a27a"/>
  <circle cx="0.78" cy="0.26" r="0.1" fill="#c9a27a"/>
 </g>
 <g id="helmet">
  <circle cx="0.04" cy="0" r="0.36" fill="url(#helm)" stroke="#1f1f1f" stroke-width="0.05"/>
  <path d="M -0.2 -0.18 A 0.3 0.3 0 0 1 0.25 -0.2" stroke="#fff" stroke-width="0.05" fill="none" opacity="0.6"/>
 </g>
 <g id="flash">
  <ellipse cx="1.62" cy="0.3" rx="0.36" ry="0.2" fill="#ffb040"/>
  <ellipse cx="1.58" cy="0.3" rx="0.2" ry="0.1" fill="#fff8d8"/>
 </g>
 <!-- Dead (art review 2026-11-14: the old pose, the live body turned 20
      degrees, read as alive): flat on its back, limbs flung wide, no team
      colour, the helmet rolled off and the rifle dropped away, all in
      cold greys, so it reads as a corpse at zoom 6. The shader draws it
      with no rim light and no shadow (it is lying on the ground). -->
 <g id="dead">
  <path d="M -0.2 0.55 L -0.55 1.15" stroke="#4a4a46" stroke-width="0.24" stroke-linecap="round"/>
  <path d="M 0.15 -0.55 L 0.75 -1.0" stroke="#4a4a46" stroke-width="0.22" stroke-linecap="round"/>
  <path d="M -0.55 -0.2 L -1.25 -0.45 M -0.55 0.2 L -1.2 0.6" stroke="#3e3e3b" stroke-width="0.22" stroke-linecap="round"/>
  <ellipse cx="-0.15" cy="0" rx="0.5" ry="0.7" fill="url(#deadbody)" stroke="#161614" stroke-width="0.06"/>
  <circle cx="0.42" cy="0.02" r="0.22" fill="#8e8a80" stroke="#1a1a18" stroke-width="0.04"/>
  <rect x="0.55" y="0.75" width="1.25" height="0.14" rx="0.05" fill="#26262a" stroke="#0e0e10" stroke-width="0.03" transform="rotate(-18 1.15 0.82)"/>
  <ellipse cx="1.05" cy="-0.95" rx="0.3" ry="0.26" fill="#77746c" stroke="#1a1a18" stroke-width="0.05"/>
  <path d="M 0.86 -1.0 A 0.22 0.2 0 0 1 1.2 -1.08" stroke="#a8a49a" stroke-width="0.04" fill="none"/>
 </g>
</svg>
