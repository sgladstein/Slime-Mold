<!-- The soldier sprite (owner's pick, 2026-11-11 16:48Z: "Solider A looks better"),
     top-down, facing +x, one unit = the soldier's radius. Layers are drawn
     separately by examples/../scripts (see README in this folder): body, helmet
     (white, tinted with the team's colour in the view), flash, dead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 4 4" width="512" height="512">
 <defs>
  <radialGradient id="helm" cx="-0.25" cy="-0.3" r="0.6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8b8b8"/></radialGradient>
  <radialGradient id="body" cx="-0.3" cy="-0.4" r="1.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#a3ad74"/><stop offset="1" stop-color="#596040"/></radialGradient>
  <radialGradient id="deadbody" cx="-0.3" cy="-0.4" r="1.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7c835c"/><stop offset="1" stop-color="#41452f"/></radialGradient>
 </defs>
 <g id="body">
  <rect x="-0.72" y="-0.42" width="0.42" height="0.84" rx="0.12" fill="#3a3d28" stroke="#22241a" stroke-width="0.04"/>
  <ellipse cx="-0.08" cy="0" rx="0.38" ry="0.8" fill="url(#body)" stroke="#2a2d1d" stroke-width="0.05"/>
  <path d="M -0.02 0.58 L 0.5 0.36" stroke="#5c6442" stroke-width="0.28" stroke-linecap="round"/>
  <path d="M 0 -0.56 L 0.78 0.26" stroke="#5c6442" stroke-width="0.26" stroke-linecap="round"/>
  <rect x="0.0" y="0.22" width="1.45" height="0.17" rx="0.05" fill="#2a2a2e" stroke="#111" stroke-width="0.03"/>
  <rect x="0.45" y="0.36" width="0.14" height="0.22" fill="#1d1d20"/>
  <circle cx="0.5" cy="0.36" r="0.1" fill="#c9a27a"/>
  <circle cx="0.78" cy="0.26" r="0.1" fill="#c9a27a"/>
 </g>
 <g id="helmet">
  <circle cx="0.04" cy="0" r="0.36" fill="url(#helm)" stroke="#1f1f1f" stroke-width="0.05"/>
  <path d="M -0.2 -0.18 A 0.3 0.3 0 0 1 0.25 -0.2" stroke="#fff" stroke-width="0.05" fill="none" opacity="0.6"/>
 </g>
 <g id="flash">
  <ellipse cx="1.62" cy="0.3" rx="0.36" ry="0.2" fill="#ffb040"/>
  <ellipse cx="1.58" cy="0.3" rx="0.2" ry="0.1" fill="#fff8d8"/>
 </g>
 <!-- Dead: a soldier fallen on its back. The art review's pose (2026-11-14:
      limbs flung wide, the helmet rolled off and the rifle dropped, in
      cold greys) read as a grey spider at zoom 6, the owner's playtest
      (2026-11-18 16:12Z: "the body on the floor looks really bad"). Now a
      person lying full length: it fell back from the slime it faced (+x),
      so the head lies behind (-x) and the boots toward it; the uniform is
      the living olive, darker and duller, so it is plainly one of ours;
      one arm flung past the head, the other out at the side, the rifle
      dropped beside. The shader draws it with no outline, rim light or
      shadow (it lies on the ground), over a pool of blood it draws itself
      (`fallen` in view.wgsl), which spreads in the seconds after the fall. -->
 <g id="dead">
  <path d="M 0.2 -0.2 L 1.2 -0.52" stroke="#3f432d" stroke-width="0.34" stroke-linecap="round"/>
  <path d="M 0.2 0.2 L 1.18 0.4" stroke="#3f432d" stroke-width="0.34" stroke-linecap="round"/>
  <ellipse cx="1.32" cy="-0.56" rx="0.17" ry="0.14" fill="#1f1d18" transform="rotate(-18 1.32 -0.56)"/>
  <ellipse cx="1.3" cy="0.43" rx="0.17" ry="0.14" fill="#1f1d18" transform="rotate(12 1.3 0.43)"/>
  <path d="M -0.55 -0.42 L -0.98 -0.86 L -1.42 -0.78" stroke="#4d5238" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M -0.45 0.44 L -0.02 0.86 L 0.4 0.98" stroke="#4d5238" stroke-width="0.24" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="-1.46" cy="-0.77" r="0.11" fill="#b08f6c"/>
  <circle cx="0.45" cy="0.99" r="0.11" fill="#b08f6c"/>
  <path d="M -0.82 -0.28 Q -0.82 -0.56 -0.54 -0.56 L 0.08 -0.42 Q 0.3 -0.38 0.3 -0.18 L 0.3 0.18 Q 0.3 0.38 0.08 0.42 L -0.54 0.56 Q -0.82 0.56 -0.82 0.28 Z" fill="url(#deadbody)" stroke="#1b1d13" stroke-width="0.05"/>
  <path d="M -0.7 -0.4 L 0.18 -0.1 M -0.7 0.4 L 0.18 0.1" stroke="#3a3e2b" stroke-width="0.06"/>
  <rect x="0.16" y="-0.44" width="0.1" height="0.88" rx="0.03" fill="#26261d"/>
  <circle cx="-1.08" cy="0.04" r="0.33" fill="#5a5f40" stroke="#181910" stroke-width="0.05"/>
  <path d="M -1.26 -0.12 A 0.26 0.26 0 0 1 -0.9 -0.18" stroke="#8b9070" stroke-width="0.04" fill="none" opacity="0.7"/>
  <rect x="-0.25" y="1.2" width="1.3" height="0.15" rx="0.05" fill="#26262a" stroke="#0e0e10" stroke-width="0.03" transform="rotate(-10 0.4 1.27)"/>
 </g>
</svg>
