<!-- The soldier sprite (owner's pick, 2026-11-11 16:48Z: "Solider A looks better"),
     top-down, facing +x, one unit = the soldier's radius. Layers are drawn
     separately by examples/../scripts (see README in this folder): body, helmet
     (white, tinted with the team's colour in the view), flash, dead. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 4 4" width="512" height="512">
 <defs>
  <radialGradient id="helm" cx="-0.25" cy="-0.3" r="0.6" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b8b8b8"/></radialGradient>
  <radialGradient id="body" cx="-0.3" cy="-0.4" r="1.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7b8458"/><stop offset="1" stop-color="#454a30"/></radialGradient>
  <radialGradient id="deadbody" cx="-0.3" cy="-0.4" r="1.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4a4f38"/><stop offset="1" stop-color="#2a2d1f"/></radialGradient>
 </defs>
 <g id="body">
  <rect x="-0.72" y="-0.42" width="0.42" height="0.84" rx="0.12" fill="#3a3d28" stroke="#22241a" stroke-width="0.04"/>
  <ellipse cx="-0.08" cy="0" rx="0.38" ry="0.8" fill="url(#body)" stroke="#2a2d1d" stroke-width="0.05"/>
  <path d="M -0.02 0.58 L 0.5 0.36" stroke="#5c6442" stroke-width="0.28" stroke-linecap="round"/>
  <path d="M 0 -0.56 L 0.78 0.26" stroke="#5c6442" stroke-width="0.26" stroke-linecap="round"/>
  <rect x="0.0" y="0.22" width="1.45" height="0.17" rx="0.05" fill="#2a2a2e" stroke="#111" stroke-width="0.03"/>
  <rect x="0.45" y="0.36" width="0.14" height="0.22" fill="#1d1d20"/>
  <circle cx="0.5" cy="0.36" r="0.1" fill="#c9a27a"/>
  <circle cx="0.78" cy="0.26" r="0.1" fill="#c9a27a"/>
 </g>
 <g id="helmet">
  <circle cx="0.04" cy="0" r="0.36" fill="url(#helm)" stroke="#1f1f1f" stroke-width="0.05"/>
  <path d="M -0.2 -0.18 A 0.3 0.3 0 0 1 0.25 -0.2" stroke="#fff" stroke-width="0.05" fill="none" opacity="0.6"/>
 </g>
 <g id="flash">
  <ellipse cx="1.62" cy="0.3" rx="0.36" ry="0.2" fill="#ffb040"/>
  <ellipse cx="1.58" cy="0.3" rx="0.2" ry="0.1" fill="#fff8d8"/>
 </g>
 <g id="dead">
  <rect x="-0.8" y="-0.3" width="0.42" height="0.8" rx="0.12" fill="#2b2d20" stroke="#18190f" stroke-width="0.04" transform="rotate(20)"/>
  <ellipse cx="-0.1" cy="0.05" rx="0.42" ry="0.78" fill="url(#deadbody)" stroke="#1a1c12" stroke-width="0.05" transform="rotate(20)"/>
  <path d="M -0.1 0.6 L -0.45 1.05" stroke="#3c412c" stroke-width="0.26" stroke-linecap="round"/>
  <path d="M 0.1 -0.6 L 0.55 -0.9" stroke="#3c412c" stroke-width="0.24" stroke-linecap="round"/>
  <rect x="0.5" y="0.55" width="1.2" height="0.15" rx="0.05" fill="#222225" transform="rotate(25 1 0.6)"/>
 </g>
</svg>
