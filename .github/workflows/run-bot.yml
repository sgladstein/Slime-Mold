# The run bot's curve (the Engine and tools lane's job 4; Milestone 1's
# exit test 1): `larder-world runbot=SEED:3` plays planets 1 to 3 of a run
# with the `bot` hand and the shop between, on Mesa's software Vulkan, and
# writes a line a planet to the run's summary: won or lost, the stars, the
# game time, the slime left, what the shop sold it. Direction posts this
# curve.
#
# WHY NOT IN EACH PULL REQUEST'S CI: a planet the bot loses plays to its
# clock (15 to 17 game minutes), about 7 real minutes here, so planets 1 to
# 3 can take 20. Each pull request's CI plays planet 1 only
# (`the_window_plays_planet_1_with_the_run_bot`). This runs after each
# landing (the merge queue dispatches it, as its GITHUB_TOKEN push starts
# no runs), every night, and by hand.
#
# It never fails on a lost planet: a loss is a measurement, not a break
# ("balance never blocks"). It fails only when the game errs or panics.
name: Run bot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

# One at a time, and a run in progress finishes: GitHub keeps only the
# newest waiting run. (Cancelling in progress, the first cut, meant a
# landing every few minutes cancelled each curve before it ended: the
# first run on main, 11-18 09:11Z, was cancelled at 09:17Z.)
concurrency:
  group: run-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: run seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
        with:
          key: run-bot
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo build --release --locked --bin larder-world
      - name: planets 1 to 3
        env:
          WGPU_BACKEND: vulkan
          SEED: ${{ matrix.seed }}
        run: |
          set -o pipefail
          ./target/release/larder-world runbot=$SEED:3 2> bot-trace.txt | tee bot.txt
          {
            echo "### Run seed $SEED, $(./target/release/larder-world version=1)"
            echo
            sed -n 's/^runbot //p' bot.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-bot-seed-${{ matrix.seed }}
          path: |
            bot.txt
            bot-trace.txt
