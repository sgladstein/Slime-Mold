# The run bot's curve (the Engine and tools lane's job 4; Milestone 1's
# exit test 1): the strategy bot (src/bin/larder-world/strat.rs) plays a
# whole run, planets 1 to 3, with the shop between, on Mesa's software
# Vulkan (`larder-world league=run:SEED:3 plan=PLAN`), and
# scripts/run_bot_summary.py writes a row a planet to the run's summary:
# won or lost, the stars, the planet's length against the 8 to 12 minute
# target, the slime left, the squad, what the shop sold it. Direction posts
# this curve.
#
# ONE BOT (NOW.md, 2026-11-20: "joined with the strategy bots rather than
# a second bot"): until then this played the run bot's own hand
# (`runbot=SEED:3`, `hands::bot_hand`). The plan is the first line of
# scripts/run-bot-plan.txt, which the strategy bot's thread sets to its
# best run plan; a run by hand may name another (`plan`).
#
# WHY NOT IN EACH PULL REQUEST'S CI: a planet the bot loses plays to its
# clock (15 to 17 game minutes), about 7 real minutes here, so planets 1 to
# 3 can take 20. Each pull request's CI plays planet 1 only
# (`the_window_plays_planet_1_with_the_run_bot`). This runs after each
# landing (the merge queue dispatches it, as its GITHUB_TOKEN push starts
# no runs), every night, and by hand.
#
# It never fails on a lost planet: a loss is a measurement, not a break
# ("balance never blocks"). It fails when the game errs or panics, and
# (Direction, 11-21) on a soft lock: a planet with no verdict by its clock
# and a minute, a run that stops with no end line, or a planet over in
# under a minute (`run_bot_summary.py --check`, which also logs each
# planet's result, held-on told apart from won, and its length).
name: Run bot

on:
  workflow_dispatch:
    inputs:
      plan:
        description: The strategy bot's plan (empty for scripts/run-bot-plan.txt)
        type: string
        default: ""
  schedule:
    - cron: "17 6 * * *"

# One at a time, and a run in progress finishes: GitHub keeps only the
# newest waiting run. (Cancelling in progress, the first cut, meant a
# landing every few minutes cancelled each curve before it ended: the
# first run on main, 11-18 09:11Z, was cancelled at 09:17Z.)
concurrency:
  group: run-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    name: run seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        seed: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
        with:
          key: run-bot
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo build --release --locked --bin larder-world
      - name: planets 1 to 3
        env:
          WGPU_BACKEND: vulkan
          SEED: ${{ matrix.seed }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -o pipefail
          if [ -z "$PLAN" ]; then
            PLAN=$(grep -v '^#' scripts/run-bot-plan.txt | grep -m1 .)
          fi
          ./target/release/larder-world league=run:$SEED:3 "plan=$PLAN" 2> bot-trace.txt | tee bot.txt
          {
            echo "_$(./target/release/larder-world version=1)_"
            echo
            python3 scripts/run_bot_summary.py "$SEED" < bot.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: soft lock check
        env:
          SEED: ${{ matrix.seed }}
        run: python3 scripts/run_bot_summary.py --check "$SEED" < bot.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run-bot-seed-${{ matrix.seed }}
          path: |
            bot.txt
            bot-trace.txt
