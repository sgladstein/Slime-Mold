# CI for the mould game. It was two jobs while the repo was private and
# Actions minutes were billed; since it went public (2026-11-12) the tests
# run as four parallel parts (the `test` job's notes). The toolchain is
# pinned to match rust-toolchain.toml (Pixel_Physics learned that a floating
# `@stable` turns clippy red on its own schedule).
name: CI

on:
  # Branch pushes are covered by their pull_request run; running both doubled
  # the billed minutes of every PR (seen on PR #1, 2026-11-10).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by merge-queue.yml on a candidate commit (main plus the queued PRs
  # merged onto it). `ref` is the commit to test, `base` the main it was built
  # on, so the docs-only check below sees the whole batch. Every other event
  # leaves both empty, and the checkouts fall back to the event's own commit.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      base:
        type: string
        required: true

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Most PRs here are reports, pictures and notes: every PR on 2026-11-10
  # (#1-#4) touched nothing outside Reports/ and handoff/. Building and
  # testing for those spends billed minutes proving nothing. This job looks
  # at what the PR changed and lets the two build jobs skip when no file can
  # reach the build. A skipped job reports as passed, so a required check
  # never hangs. Pushes to main and manual runs always build everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: diff
        run: |
          if [ -n "${{ inputs.base }}" ]; then
            files=$(git diff --name-only "${{ inputs.base }}" "${{ inputs.ref }}")
          elif [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          else
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          fi
          echo "$files"
          # Docs-only paths: nothing under them is compiled. research/ holds
          # engine sketches as .rs.txt on purpose (they need Pixel_Physics);
          # wiki/ holds Markdown and its stdlib-only lint script.
          # Anything else, including this workflow, counts as code.
          code=$(echo "$files" | grep -vE '^(Reports/|handoff/|research/|wiki/)|\.md$|^LICENSE$' | grep -c . || true)
          if [ "$code" -gt 0 ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
          echo "files that reach the build: $code"
      # The wiki's mechanical checks (wiki/README.md). Run here rather than in
      # a job of its own: this job already runs on every PR and push with full
      # history (the lint reads git dates), so it adds seconds, not a runner.
      # Docs-only PRs skip the build jobs, and those are the PRs that change
      # the wiki, so without this step the lint would never run in CI.
      - name: wiki lint
        run: python3 wiki/lint.py
      # No tracked file the .gitignore names (2026-11-15). #192 committed
      # two of the game's replays (larder-world-replay-*.txt); the game
      # rewrites them on every round there, so the owner's play.cmd saw
      # "local changes" and stopped updating, and #293's .gitignore line
      # could not help a file already tracked. This fails any commit that
      # adds one again, or anything else .gitignore says stays out.
      - name: no ignored files tracked
        run: |
          bad=$(git ls-files -ci --exclude-standard)
          if [ -n "$bad" ]; then
            echo "::error::tracked files that .gitignore excludes (git rm --cached them):"
            echo "$bad"
            exit 1
          fi

  # The tests, split four ways so they run side by side (whole-game review,
  # 2026-11-15). One `cargo test` ran its binaries one after another: on
  # #340's run (2026-11-15) the build took 90 s, then the library 230 s,
  # the window (larder-world) 196 s and the GPU sandbox (mouldgpu) 128 s,
  # 10 min 45 s in all. Each part now builds only what it tests and runs
  # alone, so CI waits for the slowest part plus its build, not the sum.
  # The repo is public (2026-11-12), so the extra runners cost no minutes.
  #
  # The parts cover every test target between them, by construction:
  # - lib: the library's unit tests.
  # - window and window smoke: larder-world's tests, split by name. One
  #   takes the tests whose names hold `the_window_plays` (the smoke rounds,
  #   the slow ones), the other skips exactly those, so a new test lands in
  #   one of the two whatever it is called.
  # - rest: every other binary (cargo metadata lists them, so a new binary
  #   is tested without editing this file), the examples, the doc tests, and
  #   clippy over all targets.
  test:
    name: test (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [lib, window, window smoke, rest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      # One cache a part: each builds a different set of targets, and parts
      # sharing a key would race to save it (the first one wins).
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
      - if: matrix.part == 'rest'
        run: cargo clippy --all-targets --release --locked -- -D warnings
      # The GPU tests (the sandbox's twin tests in `src/bin/mouldgpu.rs`,
      # the window's smoke rounds) run on Mesa's software Vulkan
      # (lavapipe); the runner has no GPU. With MOULDGPU_TEST_GPU=1 a
      # missing adapter fails them; elsewhere they skip. Every part gets
      # it: the library and the window have GPU tests too.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo test (${{ matrix.part }})
        env:
          MOULDGPU_TEST_GPU: "1"
          WGPU_BACKEND: vulkan
          PART: ${{ matrix.part }}
        run: |
          case "$PART" in
            lib) cargo test --release --locked --lib ;;
            window) cargo test --release --locked --bin larder-world -- --skip the_window_plays ;;
            "window smoke") cargo test --release --locked --bin larder-world the_window_plays ;;
            rest)
              bins=$(cargo metadata --no-deps --format-version 1 --locked \
                | jq -r '.packages[].targets[] | select((.kind == ["bin"] and .name != "larder-world") or .kind == ["test"]) | "--\(.kind[0]) \(.name)"')
              echo "targets: $bins"
              cargo test --release --locked $bins --examples
              cargo test --release --locked --doc ;;
          esac

  sound:
    name: sound device builds (organ)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --lib --bins --release --locked --features audio-alsa -- -D warnings
      - run: cargo check --locked --bin organ --bin mould --target aarch64-apple-darwin
      - run: cargo check --locked --bin organ --bin mould --target x86_64-pc-windows-msvc
