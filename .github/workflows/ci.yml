# CI for the mould game. Kept to two jobs on purpose: the repo is private, so
# Actions minutes are billed, and the whole crate builds and tests in a few
# minutes on one runner. The toolchain is pinned to match rust-toolchain.toml
# (Pixel_Physics learned that a floating `@stable` turns clippy red on its own
# schedule).
name: CI

on:
  # Branch pushes are covered by their pull_request run; running both doubled
  # the billed minutes of every PR (seen on PR #1, 2026-11-10).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Most PRs here are reports, pictures and notes: every PR on 2026-11-10
  # (#1-#4) touched nothing outside Reports/ and handoff/. Building and
  # testing for those spends billed minutes proving nothing. This job looks
  # at what the PR changed and lets the two build jobs skip when no file can
  # reach the build. A skipped job reports as passed, so a required check
  # never hangs. Pushes to main and manual runs always build everything.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          # Docs-only paths: nothing under them is compiled. research/ holds
          # engine sketches as .rs.txt on purpose (they need Pixel_Physics);
          # wiki/ holds Markdown and its stdlib-only lint script.
          # Anything else, including this workflow, counts as code.
          code=$(echo "$files" | grep -vE '^(Reports/|handoff/|research/|wiki/)|\.md$|^LICENSE$' | grep -c . || true)
          if [ "$code" -gt 0 ]; then echo "code=true"; else echo "code=false"; fi >> "$GITHUB_OUTPUT"
          echo "files that reach the build: $code"
      # The wiki's mechanical checks (wiki/README.md). Run here rather than in
      # a job of its own: this job already runs on every PR and push with full
      # history (the lint reads git dates), so it adds seconds, not a runner.
      # Docs-only PRs skip the build jobs, and those are the PRs that change
      # the wiki, so without this step the lint would never run in CI.
      # On a PR, --base also fails a page whose source report the PR changed
      # without touching the page (README rule 9, added 2026-11-11).
      - name: wiki lint
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 wiki/lint.py --base="${{ github.event.pull_request.base.sha }}"
          else
            python3 wiki/lint.py
          fi

  test:
    name: test + clippy
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --release --locked -- -D warnings
      # The GPU sandbox's twin tests (`src/bin/mouldgpu.rs`: one GPU tick
      # against one CPU tick, the same seed twice, the crowd limit) run on
      # Mesa's software Vulkan (lavapipe); the runner has no GPU. With
      # MOULDGPU_TEST_GPU=1 a missing adapter fails them; elsewhere they
      # skip. They take about 2 s on lavapipe (2026-11-11).
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - run: cargo test --release --locked
        env:
          MOULDGPU_TEST_GPU: "1"
          WGPU_BACKEND: vulkan

  sound:
    name: sound device builds (organ)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo clippy --lib --bins --release --locked --features audio-alsa -- -D warnings
      - run: cargo check --locked --bin organ --bin mould --target aarch64-apple-darwin
      - run: cargo check --locked --bin organ --bin mould --target x86_64-pc-windows-msvc
